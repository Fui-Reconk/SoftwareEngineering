<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据结构 · 结果看板 · TACES</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="app">

<aside class="sidebar" id="sidebar" aria-label="课程与账号">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <rect x="2.75" y="4" width="1.5" height="12" fill="currentColor"></rect>
      <rect x="15.75" y="4" width="1.5" height="12" fill="currentColor"></rect>
      <rect x="3.5" y="9.5" width="13" height="1" fill="currentColor" opacity=".35"></rect>
      <circle cx="10" cy="10" r="2.25" fill="currentColor"></circle>
    </svg>
    <span class="brand-text">
      <strong>TACES</strong>
      <small>可信匿名评教</small>
    </span>
  </div>

  <p class="group-label" id="courses-label">本学期课程</p>
  <div class="course-list" role="group" aria-labelledby="courses-label" id="courseList"></div>

  <div class="bottom">
    <div class="who">
      <span class="who-name">李砚秋</span>
      <span class="who-meta">教师 · 计算机科学系</span>
    </div>
    <button class="btn ghost" type="button" id="signOut">退出登录</button>
  </div>
</aside>

<div class="backdrop" id="backdrop" hidden></div>

<div class="frame">
  <header class="topbar">
    <button class="btn ghost menu-toggle" type="button" id="menuToggle" aria-expanded="false" aria-controls="sidebar" aria-label="展开课程与账号">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
      </svg>
    </button>
    <span class="topbar-context" id="topbarContext"></span>
    <span class="topbar-right">
      <span class="stamp" id="topbarStamp"></span>
      <button class="btn ghost icon-only" type="button" aria-label="使用说明">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.4" fill="none"></circle>
          <path d="M6.4 6.1a1.7 1.7 0 1 1 2.2 1.6c-.5.2-.6.6-.6 1.1" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
          <circle cx="8" cy="11.4" r=".8" fill="currentColor"></circle>
        </svg>
      </button>
    </span>
  </header>

  <main class="sheet" id="sheet" tabindex="-1"></main>
</div>

<noscript>
  <p class="noscript">这一页要从本地数据渲染，请在浏览器里允许运行脚本后再打开。</p>
</noscript>

<script src="assets/screen.js"></script>

</html>
