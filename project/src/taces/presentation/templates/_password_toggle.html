{% macro password_toggle(input_id, field_label) -%}
<button class="password-toggle" type="button" data-password-toggle
        data-show-label="显示{{ field_label }}" data-hide-label="隐藏{{ field_label }}"
        aria-controls="{{ input_id }}" aria-label="显示{{ field_label }}" aria-pressed="false" title="显示{{ field_label }}">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"></path>
    <circle cx="12" cy="12" r="3"></circle>
    <path class="password-eye-slash" d="M4 4l16 16"></path>
  </svg>
</button>
{%- endmacro %}
