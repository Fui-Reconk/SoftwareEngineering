{% extends "base.html" %}

{% block title %}查询留痕 · TACES{% endblock %}

{% block content %}
<div class="title-row">
  <div>
    <h1>查询留痕</h1>
  </div>
  <div class="title-actions">
    <label class="inline-field">
      <span class="field-label">课程</span>
      <select class="input select" id="courseFilter"></select>
    </label>
  </div>
</div>

<div class="table-wrap">
  <table class="audit">
    <thead>
      <tr>
        <th scope="col">时间</th>
        <th scope="col">操作者</th>
        <th scope="col">动作</th>
        <th scope="col">对象</th>
        <th scope="col" class="n">消耗 ε</th>
      </tr>
    </thead>
    <tbody id="auditRows"></tbody>
  </table>
  <p class="audit-empty" id="auditEmpty" hidden>这段时间没有查询记录。</p>
</div>

<div class="audit-foot">
  <button class="btn" type="button" id="loadMore" hidden>加载更多</button>
  <p class="caption">只增不改，没有删除入口。</p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/audit.js') }}"></script>
{% endblock %}
