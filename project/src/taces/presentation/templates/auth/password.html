{% extends "base.html" %}
{% block title %}修改密码 · TACES{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/password.css') }}">{% endblock %}
{% block content %}
<div class="title-row"><div>
  <h1>修改密码</h1>
  <p class="sub">修改后，所有设备需要使用新密码重新登录。</p>
</div></div>
<form class="password-form" id="passwordForm" hidden>
  <fieldset id="passwordFields">
    <label class="field"><span class="field-label">当前密码</span>
      <input class="input" id="currentPassword" type="password" autocomplete="current-password" required>
    </label>
    <label class="field"><span class="field-label">新密码</span>
      <input class="input" id="newPassword" type="password" autocomplete="new-password" required>
      <span class="caption">12–128 个字符。</span>
    </label>
    <label class="field"><span class="field-label">确认新密码</span>
      <input class="input" id="confirmPassword" type="password" autocomplete="new-password" required>
    </label>
    <p class="form-error" id="passwordError" role="alert" hidden></p>
    <button class="btn primary" type="submit">保存新密码</button>
  </fieldset>
</form>
<p class="password-success" id="passwordSuccess" role="status" hidden></p>
<a class="btn primary password-login" id="passwordLogin" href="{{ url_for('pages.login', next='/workspace') }}" hidden>重新登录</a>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/password.js') }}"></script>{% endblock %}
