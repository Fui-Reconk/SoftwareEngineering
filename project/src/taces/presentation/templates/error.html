<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ code }} · {{ title }} · TACES</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100svh;
    display: grid; place-items: center;
    background: #edf1ee; color: #131416;
    font: 14px/22px "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  main { width: min(420px, calc(100vw - 48px)); padding: 28px 24px; background: #fff;
         border: 1px solid #e0e6e2; border-radius: 16px; }
  .brand { margin: 0 0 18px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: #1f6b4e; }
  h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.25; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0 0 20px; color: #5c6265; }
  a { color: #1f6b4e; text-underline-offset: 3px; }
  .code { margin: 0; font-size: 13px; color: #666c6e; }
</style>
</head>
<body>
<main>
  <p class="brand">TACES</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <p class="code">{{ code }} · <a href="/">回到入口</a></p>
</main>
</body>
</html>
